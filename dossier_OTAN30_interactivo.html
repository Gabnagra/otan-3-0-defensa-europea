<script>
const chapters = [
{
  tag:"Introducción",
  title:"Por qué Europa ha vuelto a hablar de defensa",
  intro:"La seguridad europea atraviesa su momento de mayor tensión estratégica desde el final de la Guerra Fría. Dos debates interconectados han vuelto al centro de la agenda: la idea de una 'OTAN 3.0' y el impulso de un proyecto de defensa europeo más sólido.",
  extra:`<div class="concept-grid">
    <div class="concept-card"><div class="cc-label">Concepto central</div><div class="cc-title">OTAN 3.0</div><div class="cc-text">Europa asume la defensa convencional. EE.UU. mantiene el paraguas nuclear y capacidades estratégicas avanzadas.</div></div>
    <div class="concept-card"><div class="cc-label">Concepto central</div><div class="cc-title">Autonomía estratégica</div><div class="cc-text">Capacidad de decidir y actuar sin quedar subordinada a agendas externas. Complementaria a la OTAN, no alternativa.</div></div>
    <div class="concept-card"><div class="cc-label">Término clave</div><div class="cc-title">Burden shifting</div><div class="cc-text">Transferir la carga, no solo repartirla. Europa debe liderar su defensa, no simplemente contribuir más.</div></div>
    <div class="concept-card"><div class="cc-label">Hito reciente</div><div class="cc-title">Cumbre de La Haya (2025)</div><div class="cc-text">Compromisos de gasto del 3,5–5% del PIB. Niveles sin precedentes desde la Guerra Fría.</div></div>
  </div>`,
  sections:[
    {t:"La premisa que se ha roto",s:["elcano","ieee"],
     b:"Durante tres décadas, la arquitectura de seguridad occidental descansó sobre una premisa implícita: Estados Unidos garantizaría en última instancia la defensa del continente mientras los europeos priorizaban el bienestar social, la integración económica y operaciones exteriores de baja intensidad. Esa premisa se ha deteriorado por dos choques simultáneos: la invasión rusa de Ucrania (2022) demostró que la amenaza convencional en Europa no había desaparecido; y el giro estratégico de EE.UU. hacia el Indo-Pacífico, acelerado bajo la segunda administración Trump, ha puesto en cuestión el rol de Washington como garante último de la seguridad europea."},
    {t:"El discurso de Colby (12 febrero 2026)",s:["lgc"],
     b:"Elbridge Colby —subsecretario de Guerra de la administración Trump— pronunció ante los ministros de Defensa aliados el discurso más completo hasta la fecha de la visión estadounidense para una 'OTAN 3.0'. Bruno Tertrais (Le Grand Continent) lo analizó línea por línea: el eje central es el paso del burden sharing (reparto de carga) al burden shifting (traslado de la carga). Ya no se trata de que Europa contribuya más dentro de una estructura liderada por EE.UU., sino de que Europa asuma el liderazgo de su propia defensa convencional. EE.UU. mantiene la disuasión nuclear ampliada y el compromiso con el artículo 5."},
    {t:"El estado del debate en 2026",s:["ieee","elcano"],
     b:"A principios de 2026, el diagnóstico estratégico es claro: Rusia sigue siendo la principal amenaza militar inmediata, EE.UU. quiere un burden shifting real, y la UE necesita reforzar su papel en defensa. Lo que sigue sin resolverse es la traducción de ese diagnóstico en poder efectivo. El debate ya no gira en torno a si hace falta una defensa europea más fuerte, sino en torno a si los europeos serán capaces de superar sus bloqueos políticos, industriales y estratégicos."},
  ]
},
{
  tag:"Capítulo 1",
  title:"Autonomía estratégica europea",
  intro:"La autonomía estratégica es un objetivo antiguo de la defensa europea, pero su significado ha ido cambiando. El Real Instituto Elcano ha producido el análisis más sistemático de sus dimensiones y evolución.",
  sections:[
    {t:"Las tres dimensiones del concepto (Arteaga, Elcano 2017)",s:["elcano"],
     b:"Félix Arteaga sistematiza el concepto en tres dimensiones que pueden combinarse en proporciones distintas, generando interpretaciones distintas: (1) Dimensión política: capacidad de decisión estratégica sin subordinación a agendas externas. (2) Dimensión operativa: capacidad de planear, desplegar y sostener operaciones de cierta escala. (3) Dimensión industrial-tecnológica: base productiva capaz de fabricar, mantener y modernizar equipos sin dependencias críticas del exterior."},
    {t:"Evolución histórica: de lo operativo a lo industrial",s:["elcano"],
     b:"Tras Saint-Malo (1998) y el Consejo de Colonia (1999), dominó la dimensión operativa: una fuerza de 50.000–60.000 soldados desplegables en 60 días. La Estrategia Europea de Seguridad de 2003 no mencionó la autonomía estratégica. A partir de 2011, en una crisis industrial sin precedentes, la Comisión impulsó un enfoque industrial. Arteaga advierte: primar los intereses industriales sobre los estratégicos implica desarrollar equipos antes de saber cómo y para qué se emplearían, lo que desenfoca la Política Común de Seguridad y Defensa."},
    {t:"Autonomía estratégica 'abierta': complementariedad, no ruptura",s:["elcano","oficial"],
     b:"La posición dominante en la literatura española y europea no equivale a autarquía ni a antiatlantismo. Se trata de capacidad de decidir sin quedar subordinada. El enfoque de complementariedad (Arteaga, 2017) exige un esfuerzo adicional: cada euro en capacidades comunes debe sumar a la autonomía total, no reemplazar el gasto nacional. Los países que no puedan realizar ese esfuerzo adicional solo contribuirán a la autonomía europea en detrimento de la propia."},
    {t:"Diferencias nacionales: Francia vs. España",s:["elcano"],
     b:"Francia defiende la autonomía en sus tres dimensiones (como potencia nuclear necesita amplia libertad de acción; dispone de sector industrial bajo control público). España ha defendido en foros europeos la primacía de los intereses de seguridad sobre los industriales: una industria integrada debe ser resultado de una defensa real, no su punto de partida. Esta diferencia afecta directamente al diseño de instrumentos como PESCO y el Fondo Europeo de Defensa."},
    {t:"El cambio de Ucrania (Simón, Elcano 2022)",s:["elcano"],
     b:"Luis Simón argumenta que la guerra ha puesto de manifiesto la necesidad de avanzar de un paradigma centrado en operaciones de gestión de crisis hacia uno centrado en la defensa territorial y la disuasión. Reconociendo la primacía de la OTAN, señala el potencial de los instrumentos de la UE en desarrollo de capacidades, tecnología y compras de armamento para reforzar la contribución europea de forma indirecta pero estratégicamente significativa."},
  ]

const srcLabels = {ieee:"IEEE",elcano:"Elcano",lgc:"Le Grand Continent",eca:"TCA / UE",oficial:"Doc. oficial"};
const srcClass = {ieee:"src-ieee",elcano:"src-elcano",lgc:"src-lgc",eca:"src-eca",oficial:"src-oficial"};

let current = 0;

function buildProgress(){
  const bar = document.getElementById("progress-bar");
  bar.innerHTML = chapters.map((_,i)=>`<div class="progress-dot" id="pd${i}"></div>`).join("");
}

function updateProgress(){
  chapters.forEach((_,i)=>{
    const d = document.getElementById("pd"+i);
    d.className = "progress-dot" + (i<current?" done":i===current?" current":"");
  });
}

function srcTag(k){ return `<span class="src-tag ${srcClass[k]||'src-oficial'}">${srcLabels[k]||k}</span>`; }

function render(){
  const ch = chapters[current];
  document.getElementById("chapter-crumb").textContent = ch.tag;
  document.getElementById("chapter-name").textContent = ch.title;
  updateProgress();

  let html = `<div class="chapter-header">
    <div class="chapter-tag">${ch.tag}</div>
    <h2 class="chapter-title">${ch.title}</h2>
    <div class="chapter-intro">${ch.intro}</div>
  </div>`;

  if(ch.extra) html += ch.extra;

  html += `<div class="acc-group">`;
  ch.sections.forEach((s,i)=>{
    const srcs = (s.s||[]).map(srcTag).join("");
    html += `<div class="acc${i===0?' open':''}">
      <button class="acc-head" onclick="toggleAcc(this.parentElement)">
        <div class="acc-head-left">
          <span class="acc-index">${String(i+1).padStart(2,'0')}</span>
          <span class="acc-title">${s.t}</span>
        </div>
        <span class="acc-arrow">▶</span>
      </button>
      <div class="acc-body">
        <p>${s.b}</p>
        <div class="sources">${srcs}</div>
      </div>
    </div>`;
  });
  html += `</div>`;

  const hasPrev = current > 0;
  const hasNext = current < chapters.length - 1;
  html += `<div id="nav-footer">
    ${hasPrev ? `<button class="nav-btn" onclick="go(${current-1})">← ${chapters[current-1].tag}</button>` : '<span></span>'}
    ${hasNext ? `<button class="nav-btn primary" onclick="go(${current+1})">${chapters[current+1].tag} →</button>` : '<span style="font-size:13px;color:var(--text-muted);font-style:italic">Fin del dossier</span>'}
  </div>`;

  document.getElementById("content").innerHTML = html;
  window.scrollTo({top:0,behavior:'smooth'});

  document.querySelectorAll(".nav-item").forEach((btn,i)=>{
    btn.classList.toggle("active", i===current);
  });
}

function toggleAcc(el){
  el.classList.toggle("open");
}

function go(i){
  current = i;
  render();
  if(window.innerWidth<=768){
    document.getElementById("sidebar").classList.remove("open");
  }
}

function toggleMobile(){
  document.getElementById("sidebar").classList.toggle("open");
}

buildProgress();
render();
</script>

</html>
